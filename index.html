<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reparto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#c8102e">
<style>
html,body{margin:0;height:100%;background:#111}
iframe{border:0;width:100%;height:100%;display:block}
#inst{position:fixed;right:14px;bottom:14px;z-index:9;display:none;padding:10px 16px;border:0;border-radius:999px;background:#c8102e;color:#fff;font:600 14px system-ui;box-shadow:0 4px 14px #0006;cursor:pointer}
</style></head><body>
<!-- ⚠️ PEGA AQUÍ LA URL DE TU APLICACIÓN WEB: tu-url/exec y deja ?m=reparto al final -->
<iframe id="app" src="https://script.google.com/macros/s/AKfycbxJ4VdkDC5UIDFlIKV9RLuYuQr-pppRoMPlwiT7ZwwCinzieFkCcO_kk9H-t0uSbDo7/exec?m=reparto" allow="geolocation; clipboard-write; fullscreen"></iframe>
<button id="inst">⬇ Instalar app de reparto</button>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
let ev=null; const b=document.getElementById('inst');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;b.style.display='block';});
b.onclick=async()=>{ if(!ev)return; ev.prompt(); await ev.userChoice; ev=null; b.style.display='none'; };
window.addEventListener('appinstalled',()=>{b.style.display='none';});
if(matchMedia('(display-mode: standalone)').matches) b.style.display='none';
</script></body></html>
